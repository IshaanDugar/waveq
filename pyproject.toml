[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waveq"
version = "3.1.0"
description = "Let AI agents read simulation waveforms: exact answers from VCD/FST dumps over MCP, zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ishaan Dugar"}]
keywords = ["vcd", "fst", "waveform", "verilog", "systemverilog", "vhdl", "fpga", "rtl", "simulation", "verification", "cocotb", "verilator", "gtkwave", "eda", "mcp", "model-context-protocol", "ai-agent", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.urls]
Homepage = "https://ishaandugar.github.io/waveq/"
Documentation = "https://github.com/IshaanDugar/waveq#readme"
Changelog = "https://github.com/IshaanDugar/waveq/blob/main/CHANGELOG.md"
Repository = "https://github.com/IshaanDugar/waveq"
Issues = "https://github.com/IshaanDugar/waveq/issues"

[project.scripts]
waveq = "waveq.cli:main"
waveq-mcp = "waveq.mcp_server:main"

[tool.setuptools.packages.find]
include = ["waveq*"]
