name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Compile check
        shell: bash
        run: python -m py_compile waveq/*.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Ground-truth check on a generated SoC-style dump
        run: python benchmarks/realistic_vcd.py --cycles 5000 --filler 8
